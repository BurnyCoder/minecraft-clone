<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniCraft – multiple block types</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden}
    canvas{display:block}
    #crosshair{position:fixed;top:50%;left:50%;width:12px;height:12px;margin:-6px 0 0 -6px;background:radial-gradient(circle,#fff 0%,#fff 30%,transparent 30%);pointer-events:none;opacity:.7}
    #overlay{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);padding:.4rem .8rem;font:600 0.9rem/1 sans-serif;color:#fff;background:rgba(0,0,0,.5);border-radius:.4rem;pointer-events:none;text-align:center;white-space:pre}
  </style>

  <!-- Import map so example modules can reference "three" -->
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
  <canvas id="bg"></canvas>
  <div id="crosshair"></div>
  <div id="overlay"></div>

  <script type="module">
    /*********************************************************************
     * MiniCraft – multiple block types & collisions (three.js r160)     *
     *********************************************************************/

    // ───────── Imports ─────────
    import * as THREE from 'three';
    import { PointerLockControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/PointerLockControls.js?module';

    // ───────── Gameplay constants ─────────
    const BLOCK = 1;
    const WORLD_W = 32, WORLD_D = 32, WORLD_H = 8;  // world size in blocks

    const EYE_HEIGHT     = 1.6;
    const PLAYER_HEIGHT  = 1.8;
    const PLAYER_RADIUS  = 0.3;
    const GRAVITY        = 30;
    const WALK_SPEED     = 8;
    const JUMP_SPEED     = 10;

    // ───────── THREE setup ─────────
    const canvas = document.getElementById('bg');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1));

    const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
    camera.position.set(0, 20, 0);

    const controls = new PointerLockControls(camera, document.body);
    canvas.addEventListener('click', () => controls.lock());

    // ───────── Block definitions ─────────
    const loader = new THREE.TextureLoader();

    const blockTypes = [
      {
        name: 'Grass',
        mats: (()=>{ // top green, bottom dirt, sides grass
          const matTop    = new THREE.MeshLambertMaterial({color:0x3da35d});
          const matBottom = new THREE.MeshLambertMaterial({color:0x795548});
          const matSide   = new THREE.MeshLambertMaterial({color:0x567d46});
          return [matSide,matSide,matTop,matBottom,matSide,matSide];
        })()
      },
      {
        name: 'Dirt',
        mats: Array(6).fill(new THREE.MeshLambertMaterial({color:0x8e5a3c}))
      },
      {
        name: 'Stone',
        mats: Array(6).fill(new THREE.MeshLambertMaterial({color:0x777777}))
      },
      {
        name: 'Sand',
        mats: Array(6).fill(new THREE.MeshLambertMaterial({color:0xe2d9a7}))
      },
      {
        name: 'Wood',
        mats: Array(6).fill(new THREE.MeshLambertMaterial({color:0x8b5a2b}))
      }
    ];

    let selectedType = 0;

    // ───────── World data ─────────
    const cubeGeo = new THREE.BoxGeometry(BLOCK, BLOCK, BLOCK);

    // Map key → {mesh,type}
    const world = new Map();
    const key = (x,y,z)=>`${x},${y},${z}`;
    const toBlock = v=>Math.floor(v/BLOCK + 0.5);

    function placeBlock(bx,by,bz,type=selectedType){
      const k = key(bx,by,bz);
      if(world.has(k)) return; // already occupied
      const cube = new THREE.Mesh(cubeGeo, blockTypes[type].mats);
      cube.position.set(bx*BLOCK, by*BLOCK + BLOCK/2, bz*BLOCK);
      cube.castShadow = cube.receiveShadow = false;
      cube.userData = {bx,by,bz};
      scene.add(cube);
      world.set(k,{mesh:cube,type});
    }
    function removeBlock(mesh){
      const {bx,by,bz} = mesh.userData;
      const k = key(bx,by,bz);
      world.delete(k);
      scene.remove(mesh);
    }

    // Generate layered terrain: top grass, then 2 dirt, rest stone
    for(let x=-WORLD_W/2;x< WORLD_W/2;x++)
      for(let z=-WORLD_D/2;z< WORLD_D/2;z++)
        for(let y=0;y<WORLD_H;y++){
          const type = y===WORLD_H-1 ? 0 : (y>=WORLD_H-3 ? 1 : 2); // grass/dirt/stone
          placeBlock(x,y,z,type);
        }

    // ───────── Interaction ─────────
    const raycaster = new THREE.Raycaster();
    window.addEventListener('contextmenu',e=>e.preventDefault());

    window.addEventListener('mousedown',e=>{
      if(!controls.isLocked) return;
      if(![0,2].includes(e.button)) return;
      raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
      const hit = raycaster.intersectObjects(scene.children,false)[0];
      if(!hit) return;

      if(e.button===0){ // mine
        removeBlock(hit.object);
      }else{ // place
        const p = hit.object.position.clone().add(hit.face.normal.multiplyScalar(BLOCK));
        placeBlock(toBlock(p.x), toBlock(p.y - BLOCK/2), toBlock(p.z));
      }
    });

    // Hot‑bar selection (keys 1‑5)
    const overlay = document.getElementById('overlay');
    function updateOverlay(){
      overlay.innerHTML = `Block: <b>${blockTypes[selectedType].name}</b>\n(1‑${blockTypes.length} to switch)`;
    }
    updateOverlay();

    window.addEventListener('keydown',e=>{
      if(e.code.startsWith('Digit')){
        const idx = Number(e.code.slice(5))-1;
        if(idx>=0 && idx<blockTypes.length){
          selectedType = idx;
          updateOverlay();
        }
      }
    });

    // ───────── Movement & physics ─────────
    const vel = new THREE.Vector3();
    let onGround=false;
    const keys={};
    addEventListener('keydown',e=>keys[e.code]=true);
    addEventListener('keyup',e=>keys[e.code]=false);

    function collides(pos){
      const minX = pos.x - PLAYER_RADIUS;
      const maxX = pos.x + PLAYER_RADIUS;
      const minY = pos.y - EYE_HEIGHT;
      const maxY = minY + PLAYER_HEIGHT;
      const minZ = pos.z - PLAYER_RADIUS;
      const maxZ = pos.z + PLAYER_RADIUS;

      const minBX = toBlock(minX - BLOCK/2);
      const maxBX = toBlock(maxX + BLOCK/2);
      const minBY = toBlock(minY);
      const maxBY = toBlock(maxY);
      const minBZ = toBlock(minZ - BLOCK/2);
      const maxBZ = toBlock(maxZ + BLOCK/2);

      for(let x=minBX;x<=maxBX;x++)
        for(let y=minBY;y<=maxBY;y++)
          for(let z=minBZ;z<=maxBZ;z++)
            if(world.has(key(x,y,z))) return true;
      return false;
    }

    function attemptMove(dt){
      const obj = controls.getObject();
      const pos = obj.position.clone();
      // build wish move (local → world)
      const dir = new THREE.Vector3();
      if(keys['KeyW']) dir.z -=1;
      if(keys['KeyS']) dir.z +=1;
      if(keys['KeyA']) dir.x -=1;
      if(keys['KeyD']) dir.x +=1;
      dir.normalize();
      const wish = new THREE.Vector3(dir.x,0,dir.z).applyQuaternion(camera.quaternion).multiplyScalar(WALK_SPEED*dt);

      // gravity
      vel.y -= GRAVITY*dt;
      wish.y = vel.y*dt;

      let np = pos.clone();

      np.x += wish.x;
      if(collides(np)) np.x = pos.x;

      np.z += wish.z;
      if(collides(np)) np.z = pos.z;

      np.y += wish.y;
      if(collides(np)){
        if(wish.y<0){
          onGround = true;
          vel.y = 0;
          const feet = np.y - EYE_HEIGHT;
          const by = Math.floor(feet/BLOCK + 0.5);
          np.y = by*BLOCK + BLOCK + EYE_HEIGHT;
        }else if(wish.y>0){
          vel.y=0;
        }
        np.y = pos.y;
      }else{
        onGround=false;
      }

      obj.position.copy(np);

      if(onGround && keys['Space']){vel.y=JUMP_SPEED;onGround=false;}
    }

    let prev=performance.now();
    function animate(){
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = (now-prev)/1000;
      prev = now;
      if(controls.isLocked) attemptMove(dt);
      renderer.render(scene,camera);
    }
    animate();

    addEventListener('resize',()=>{
      camera.aspect=innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });
  </script>
</body>
</html>
